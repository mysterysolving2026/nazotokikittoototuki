<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>切りたいコードの色は？</title>

  <style>
    @font-face {
      font-family: "Let's go Digital";
      src: url("Let's go Digital Regular.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px 90px;
      background-color: black;
      color: white;
      font-size: 24px;
      line-height: 1.6;
    }

    .timer {
      font-family: "Let's go Digital", sans-serif;
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin: 10px 0 40px;
    }

    .question {
      margin: 36px auto 0;
      max-width: 600px;
    }

    .question-title {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .input-box {
      width: 100%;
      max-width: 340px;
      font-size: 24px;
      padding: 12px;
      text-align: center;
    }

    button {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      font-size: 24px;
      padding: 12px 32px;
      min-height: 52px;
      margin-top: 14px;
      background-color: white;
      color: black;
      border: none;
      border-radius: 6px;
    }

    .color-display {
      font-size: 32px;
      margin-top: 14px;
      min-height: 1.6em;
      letter-spacing: 0.1em;
    }

    .error {
      color: red;
      font-size: 24px;
      margin-top: 8px;
      min-height: 1.6em;
    }

    .message {
      font-size: 34px;
      margin-top: 30px;
      color: yellow;
    }

    /* 右下の隠し「入力」ボタン */
    .small-button {
      position: fixed;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      font-size: 16px;
      padding: 10px 14px;
      min-height: 0;
      margin: 0;
      background-color: black;
      color: #4B0082;
      border: 2px solid black;
      display: none;
    }
  </style>
</head>

<body>

  <!-- タイマー -->
  <div id="timer" class="timer"></div>

  <!-- 共通の案内 -->
  <h1>
    切りたいコードの色は？<br>
    1色ずつ入力してね
  </h1>


  <!-- 問題4 -->
  <div class="question">

    <div class="question-title">
      ➃歌詞に隠された色は？
    </div>

    <input
      type="text"
      id="colorInput4"
      class="input-box"
      placeholder="色を入力"
    >

    <br>

    <button onclick="checkColor4()">
      決定
    </button>

    <div id="err4" class="error"></div>

    <div id="colorList4" class="color-display"></div>

  </div>


  <!-- 問題5 -->
  <div class="question">

    <div class="question-title">
      ⑤現れた色は？
    </div>

    <input
      type="text"
      id="colorInput5"
      class="input-box"
      placeholder="色を入力"
    >

    <br>

    <button onclick="checkColor5()">
      決定
    </button>

    <div id="err5" class="error"></div>

    <div id="colorList5" class="color-display"></div>

  </div>


  <!-- 4色そろった時の表示 -->
  <div id="msg" class="message"></div>

  <button
    id="backButton"
    style="display:none;"
    onclick="goBack()"
  >
    戻る
  </button>


  <!-- 右下の隠しボタン -->
  <button
    id="finalButton"
    class="small-button"
    onclick="goToFinal()"
  >
    入力
  </button>


  <script>

    localStorage.setItem("currentPage", "colors.html");


    /*
    ------------------------------
    タイマー
    ------------------------------
    */

    const TIME_LIMIT = 60 * 60 * 1000;

    function initTimer() {

      if (localStorage.getItem("bombCleared") === "true") {
        return;
      }

      if (!localStorage.getItem("endTime")) {
        localStorage.setItem(
          "endTime",
          Date.now() + TIME_LIMIT
        );
      }

      updateTimer();

      setInterval(updateTimer, 1000);
    }


    function updateTimer() {

      if (localStorage.getItem("bombCleared") === "true") {
        return;
      }

      const endTime =
        Number(localStorage.getItem("endTime"));

      const remaining =
        Math.floor((endTime - Date.now()) / 1000);


      if (remaining <= 0) {

        window.location.href = "gameover.html";

        return;
      }


      const m =
        String(Math.floor(remaining / 60))
        .padStart(2, "0");

      const s =
        String(remaining % 60)
        .padStart(2, "0");


      document.getElementById("timer").textContent =
        m + ":" + s;
    }


    initTimer();



    /*
    ------------------------------
    色の表記ゆれ
    ------------------------------
    */

    const colorMap = {

      "赤": [
        "あか",
        "あかいろ",
        "赤",
        "赤色"
      ],

      "青": [
        "あお",
        "あおいろ",
        "青",
        "青色"
      ],

      "黒": [
        "くろ",
        "くろいろ",
        "黒",
        "黒色"
      ],

      "黄": [
        "き",
        "きいろ",
        "黄",
        "黄色"
      ]

    };



    /*
    ------------------------------
    正解済みデータを復元
    ------------------------------
    */

    const foundColors4 =
      JSON.parse(
        localStorage.getItem("foundColors4") || "[]"
      );

    const foundColors5 =
      JSON.parse(
        localStorage.getItem("foundColors5") || "[]"
      );


    updateDisplay();



    /*
    ------------------------------
    入力された色を判定する
    ------------------------------
    */

    function getMatchedColor(input) {

      for (const key in colorMap) {

        if (colorMap[key].includes(input)) {
          return key;
        }

      }

      return null;
    }



    /*
    ------------------------------
    問題4

    正解：青・黒
    ------------------------------
    */

    function checkColor4() {

      const input =
        document
        .getElementById("colorInput4")
        .value
        .trim();


      const matchedColor =
        getMatchedColor(input);


      if (
        matchedColor === "青" ||
        matchedColor === "黒"
      ) {

        if (!foundColors4.includes(matchedColor)) {

          foundColors4.push(matchedColor);

          localStorage.setItem(
            "foundColors4",
            JSON.stringify(foundColors4)
          );

        }

        document.getElementById("err4").textContent = "";

      } else {

        alert(
          "その色は切るべきコードではありません"
        );

        document.getElementById("err4").textContent =
          "間違ってるよ";
      }


      document.getElementById("colorInput4").value = "";

      updateDisplay();

      checkAllColors();
    }



    /*
    ------------------------------
    問題5

    正解：赤・黄
    ------------------------------
    */

    function checkColor5() {

      const input =
        document
        .getElementById("colorInput5")
        .value
        .trim();


      const matchedColor =
        getMatchedColor(input);


      if (
        matchedColor === "赤" ||
        matchedColor === "黄"
      ) {

        if (!foundColors5.includes(matchedColor)) {

          foundColors5.push(matchedColor);

          localStorage.setItem(
            "foundColors5",
            JSON.stringify(foundColors5)
          );

        }

        document.getElementById("err5").textContent = "";

      } else {

        alert(
          "その色は切るべきコードではありません"
        );

        document.getElementById("err5").textContent =
          "間違ってるよ";
      }


      document.getElementById("colorInput5").value = "";

      updateDisplay();

      checkAllColors();
    }



    /*
    ------------------------------
    正解済みの色を表示
    ------------------------------
    */

    function updateDisplay() {

      document.getElementById("colorList4")
        .textContent =
        foundColors4.join("・");


      document.getElementById("colorList5")
        .textContent =
        foundColors5.join("・");
    }



    /*
    ------------------------------
    4色すべて見つかったか確認
    ------------------------------
    */

    function checkAllColors() {

      if (
        foundColors4.length === 2 &&
        foundColors5.length === 2
      ) {

        document.getElementById("msg")
          .textContent =
          "爆弾解除？";

        document.getElementById("backButton")
          .style.display =
          "inline-block";

        document.getElementById("finalButton")
          .style.display =
          "block";

      }

    }



    /*
    ------------------------------
    ページを開いた時にも確認

    戻ってきた場合の復元用
    ------------------------------
    */

    checkAllColors();



    /*
    ------------------------------
    ページ移動
    ------------------------------
    */

    function goBack() {
      history.back();
    }


    function goToFinal() {
      window.location.href = "final.html";
    }

  </script>

</body>
</html>
