<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杏ちゃんの謎解き</title>
  <style>
    /* フォントファイル名は digital.ttf に変更して、HTMLと同じフォルダに置く */
    @font-face {
      font-family: "Let's go Digital";
      src: url("Let's go Digital Regular.ttf") format("truetype");
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px;
      font-size: 24px;
      line-height: 1.6;
    }

    .timer {
      font-family: "Let's go Digital", sans-serif;
      font-size: 64px;
      margin: 20px;
    }

    .question {
      margin: 36px auto 0;
      max-width: 600px;
      font-size: 24px;
    }

    .input-box {
      width: 100%;
      max-width: 320px;
      font-size: 24px;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    button {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      font-size: 24px;
      padding: 12px 32px;
      min-height: 52px;
      margin-top: 14px;
      background-color: black;
      color: white;
      border: 2px solid black;
      border-radius: 6px;
    }

    .error {
      color: red;
      font-size: 24px;
      margin-top: 8px;
      min-height: 1.6em;
    }

    #nextButton {
      margin-top: 40px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 音声ボタン -->
  <audio id="introAudio" src="beep-02.mp3"></audio>
  <button id="playButton" onclick="playIntro()">音声を再生</button>

  <!-- カウントダウン -->
  <div id="timer" class="timer"></div>

  <!-- 小謎3問（最初は非表示） -->
  <div id="puzzles" style="display:none;">
    <div class="question">
      ➀：杏ちゃんのMBTIは？
      <br>
      <input id="q1" class="input-box">
      <br>
      <button onclick="checkQ1()">決定</button>
      <div id="e1" class="error"></div>
    </div>

    <div class="question">
      ➁：星を重ねて月を見るとき、秒針、長針、短針が示す数字は？
      <br>
      <input id="q2" class="input-box" inputmode="numeric">
      <br>
      <button onclick="checkQ2()">決定</button>
      <div id="e2" class="error"></div>
    </div>

    <div class="question">
      ➂：新曲のタイトルは？
      <br>
      <input id="q3" class="input-box">
      <br>
      <button onclick="checkQ3()">決定</button>
      <div id="e3" class="error"></div>
    </div>

    <button id="nextButton" onclick="goToColors()">次のページへ</button>
  </div>

  <script>
  localStorage.setItem("currentPage", "index.html");

  let timerInterval = null;

  function playIntro() {
  const audio = document.getElementById("introAudio");

  // 最初から再生
  audio.currentTime = 0;
  audio.play();

  // 音声が終わったとき
  audio.onended = () => {

    // まだタイマーが始まっていない場合だけ60分からスタート
    if (!localStorage.getItem("endTime")) {
      startCountdown();
    }

    // 問題を表示
    showPuzzles();
  };
}

  // カウントダウン開始（音声を再生するたびに30分から新しく始める）
　function startCountdown() {

  // すでにタイマーが動いている場合はリセットしない
  const endTime = Number(localStorage.getItem("endTime"));

  if (endTime > Date.now()) {
    runTimer();
    return;
  }

  // 初回だけ60分をセット
  localStorage.removeItem("bombCleared");
  localStorage.setItem(
    "endTime",
    Date.now() + 60 * 60 * 1000
  );

  runTimer();
}
    
  // タイマーを動かす（二重に動かないようにする）
  function runTimer() {
    if (timerInterval) clearInterval(timerInterval);
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  // カウントダウン表示更新
  function updateTimer() {
    const endTime = Number(localStorage.getItem("endTime"));
    const remaining = Math.floor((endTime - Date.now()) / 1000);

    if (remaining <= 0) {
      window.location.href = "gameover.html";
      return;
    }

    const m = String(Math.floor(remaining / 60)).padStart(2, "0");
    const s = String(remaining % 60).padStart(2, "0");
    document.getElementById("timer").textContent = `${m}:${s}`;
  }

  // 小謎を表示
  function showPuzzles() {
    document.getElementById("puzzles").style.display = "block";
  }

  let q1ok = false, q2ok = false, q3ok = false;

  function checkAll() {
    if (q1ok && q2ok && q3ok) {
      document.getElementById("nextButton").style.display = "inline-block";
    }
  }

  function checkQ1() {
    const v = document.getElementById("q1").value.trim();
    if (v === "3635") {
      q1ok = true;
      document.getElementById("e1").textContent = "正解！";
    } else {
      q1ok = false;
      document.getElementById("e1").textContent = "間違ってるよ";
    }
    checkAll();
  }

  function checkQ2() {
    const v = document.getElementById("q2").value.trim();
    if (v === "4701") {
      q2ok = true;
      document.getElementById("e2").textContent = "正解！";
    } else {
      q2ok = false;
      document.getElementById("e2").textContent = "間違ってるよ";
    }
    checkAll();
  }

  function checkQ3() {
    const v = document.getElementById("q3").value.trim();
    if (v === "アンブレラサンセット") {
      q3ok = true;
      document.getElementById("e3").textContent = "正解！";
    } else {
      q3ok = false;
      document.getElementById("e3").textContent = "間違ってるよ";
    }
    checkAll();
  }

  function goToColors() {
    window.location.href = "colors.html";
  }

  // 「続ける」で戻ってきたときは、音声なしで問題とタイマーを表示
  if (Number(localStorage.getItem("endTime")) > Date.now()) {
    runTimer();
    showPuzzles();
  }
  </script>

</body>
</html>
