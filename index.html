<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杏ちゃんの謎解き</title>

  <style>
    @font-face {
      font-family: "Let's go Digital";
      src: url("Let's go Digital Regular.ttf") format("truetype");
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px;
      font-size: 24px;
      line-height: 1.6;
    }

    .timer {
      font-family: "Let's go Digital", sans-serif;
      font-size: 64px;
      margin: 20px;
      min-height: 1.2em;
    }

    .question {
      margin: 36px auto 0;
      max-width: 600px;
      font-size: 24px;
    }

    .input-box {
      width: 100%;
      max-width: 320px;
      font-size: 24px;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }

    button {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      font-size: 24px;
      padding: 12px 32px;
      min-height: 52px;
      margin-top: 14px;
      background-color: black;
      color: white;
      border: 2px solid black;
      border-radius: 6px;
    }

    .error {
      color: red;
      font-size: 24px;
      margin-top: 8px;
      min-height: 1.6em;
    }

    #nextButton {
      margin-top: 40px;
      display: none;
    }
  </style>
</head>

<body>

  beep-02.mp3</audio>

  <button id="playButton" onclick="playIntro()">
    音声を再生
  </button>

  <div id="timer" class="timer"></div>

  <div id="puzzles" style="display:none;">

    <div class="question">
      ➀：杏ちゃんのMBTIは？
      <br>
      <input id="q1" class="input-box">
      <br>
      <button onclick="checkQ1()">決定</button>
      <div id="e1" class="error"></div>
    </div>

    <div class="question">
      ➁：星を重ねて月を見るとき、秒針、長針、短針が示す数字は？
      <br>
      <input id="q2" class="input-box" inputmode="numeric">
      <br>
      <button onclick="checkQ2()">決定</button>
      <div id="e2" class="error"></div>
    </div>

    <div class="question">
      ➂：新曲のタイトルは？
      <br>
      <input id="q3" class="input-box">
      <br>
      <button onclick="checkQ3()">決定</button>
      <div id="e3" class="error"></div>
    </div>

    <button id="nextButton" onclick="goToColors()">
      次のページへ
    </button>

  </div>

  <script>

    /*
    =========================
    基本設定
    =========================
    */

    localStorage.setItem("currentPage", "index.html");

    const GAME_TIME = 60 * 60 * 1000;

    let timerInterval = null;

    /*
    =========================
    音声
    =========================
    */

    function playIntro() {

      const audio = document.getElementById("introAudio");

      // 押すたびに音声を最初から再生
      audio.currentTime = 0;
      audio.play();

      audio.onended = () => {

        /*
        endTimeそのものが存在しない場合だけ、
        新しいゲームとして60分を設定する。

        すでにendTimeがある場合は絶対に変更しない。
        */

        if (localStorage.getItem("endTime") === null) {

          localStorage.removeItem("bombCleared");

          localStorage.setItem(
            "endTime",
            String(Date.now() + GAME_TIME)
          );

          runTimer();
        }

        showPuzzles();
      };
    }

    /*
    =========================
    タイマー
    =========================
    */

    function runTimer() {

      if (timerInterval !== null) {
        clearInterval(timerInterval);
      }

      updateTimer();

      timerInterval = setInterval(
        updateTimer,
        1000
      );
    }


    function updateTimer() {

      const savedEndTime =
        localStorage.getItem("endTime");

      // まだ一度もゲームを開始していない
      if (savedEndTime === null) {

        document.getElementById("timer")
          .textContent = "";

        return;
      }

      const endTime = Number(savedEndTime);

      const remaining =
        Math.ceil(
          (endTime - Date.now()) / 1000
        );

      // 時間切れ
      if (remaining <= 0) {

        if (timerInterval !== null) {
          clearInterval(timerInterval);
        }

        window.location.replace("gameover.html");

        return;
      }

      const minutes =
        String(
          Math.floor(remaining / 60)
        ).padStart(2, "0");

      const seconds =
        String(
          remaining % 60
        ).padStart(2, "0");

      document.getElementById("timer")
        .textContent =
        `${minutes}:${seconds}`;
    }

    /*
    =========================
    問題表示
    =========================
    */

    function showPuzzles() {

      document.getElementById("puzzles")
        .style.display = "block";
    }


    let q1ok = false;
    let q2ok = false;
    let q3ok = false;


    function checkAll() {

      if (q1ok && q2ok && q3ok) {

        document.getElementById("nextButton")
          .style.display = "inline-block";
      }
    }


    function checkQ1() {

      const v =
        document.getElementById("q1")
        .value
        .trim();

      if (v === "3635") {

        q1ok = true;

        document.getElementById("e1")
          .textContent = "正解！";

      } else {

        q1ok = false;

        document.getElementById("e1")
          .textContent = "間違ってるよ";
      }

      checkAll();
    }


    function checkQ2() {

      const v =
        document.getElementById("q2")
        .value
        .trim();

      if (v === "4701") {

        q2ok = true;

        document.getElementById("e2")
          .textContent = "正解！";

      } else {

        q2ok = false;

        document.getElementById("e2")
          .textContent = "間違ってるよ";
      }

      checkAll();
    }


    function checkQ3() {

      const v =
        document.getElementById("q3")
        .value
        .trim();

      if (v === "アンブレラサンセット") {

        q3ok = true;

        document.getElementById("e3")
          .textContent = "正解！";

      } else {

        q3ok = false;

        document.getElementById("e3")
          .textContent = "間違ってるよ";
      }

      checkAll();
    }


    function goToColors() {
      window.location.href = "colors.html";
    }

    /*
    =========================
    index.htmlを開いたとき
    =========================
    */

    const existingEndTime =
      localStorage.getItem("endTime");

    if (existingEndTime !== null) {

      // ゲームがすでに開始されている場合
      // 音声を聞かなくてもタイマーと問題を表示

      runTimer();
      showPuzzles();
    }

  </script>

</body>
</html>
