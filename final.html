<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで正しい幅・倍率で表示するための指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>切りたい色コードは？</title>
  <style>
    /* 「@」が抜けていたので修正 */
    @font-face {
      font-family: "Let's go Digital";
      src: url("Let's go Digital Regular.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px 80px;
      background-color: black;
      color: white;
      font-size: clamp(18px, 4.5vw, 22px);
      line-height: 1.6;
    }

    .timer {
      font-family: "Let's go Digital", sans-serif;
      font-size: clamp(48px, 16vw, 60px);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(26px, 7vw, 34px);
      margin: 10px 0 20px;
    }

    .input-box {
      width: 100%;
      max-width: 320px;
      /* iPhoneの自動ズームを防ぐため16px以上 */
      font-size: 20px;
      padding: 10px;
      text-align: center;
    }

    button {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      font-size: 20px;
      padding: 12px 28px;
      min-height: 48px;
      margin-top: 12px;
      background-color: white;
      color: black;
      border: none;
      border-radius: 6px;
    }

    .color-display {
      font-size: clamp(26px, 8vw, 36px);
      margin-top: 24px;
      min-height: 1.6em;
      letter-spacing: 0.1em;
    }

    /* 右下の隠しボタン（目立たないまま、指で押せる大きさに） */
    .small-button {
      position: fixed;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      font-size: 14px;
      padding: 10px 14px;
      min-height: 0;
      margin: 0;
      background-color: black;
      color: #4B0082;
      border: 2px solid black;
    }

    .message {
      font-size: clamp(22px, 6vw, 28px);
      margin-top: 15px;
      color: yellow;
    }

    .error {
      color: red;
      font-size: 20px;
      margin-top: 8px;
      min-height: 1.6em;
    }
  </style>
</head>
<body>

  <div id="timer" class="timer"></div>

  <h1>切りたいコードの色を入力してね</h1>

  <!-- 手入力欄 -->
  <input type="text" id="colorInput" class="input-box" placeholder="色を入力">
  <br>
  <button class="check-button" onclick="checkColor()">決定</button>

  <!-- メッセージ表示欄（スクリプトが使っているのに無かったので追加） -->
  <div id="err" class="error"></div>

  <!-- 色が浮かび上がる場所 -->
  <div id="colorList" class="color-display"></div>

  <div id="msg" class="message"></div>

  <!-- 戻るボタン -->
  <button id="backButton" class="back-button" style="display:none;" onclick="goBack()">戻る</button>

  <!-- 右下の小さな「入力」ボタン -->
  <button class="small-button" onclick="goToFinal()">入力</button>

  <script>
    function initTimer() {
      if (localStorage.getItem("bombCleared") === "true") return;

      if (!localStorage.getItem("endTime")) {
        const end = Date.now() + 10 * 60 * 1000;
        localStorage.setItem("endTime", end);
      }
      updateTimer();
      setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (localStorage.getItem("bombCleared") === "true") return;

      const endTime = Number(localStorage.getItem("endTime"));
      const now = Date.now();
      const remaining = Math.floor((endTime - now) / 1000);

      if (remaining <= 0) {
        window.location.href = "gameover.html";
        return;
      }
      const m = String(Math.floor(remaining / 60)).padStart(2, "0");
      const s = String(remaining % 60).padStart(2, "0");
      document.getElementById("timer").textContent = m + ":" + s;
    }

    initTimer();

    function normalizeColors(str) {
      return str.split(/、|,|\s+/).filter(x => x).map(x => x.trim());
    }

    // 正解色の判定用辞書
    const colorMap = {
      "赤": ["あか", "あかいろ", "赤", "赤色"],
      "青": ["あお", "あおいろ", "青", "青色"],
      "黒": ["くろ", "くろいろ", "黒", "黒色"],
      "黄": ["き", "きいろ", "黄", "黄色"]
    };

    // すでに表示された色を記録
    const foundColors = [];

    function checkColor() {
      const input = document.getElementById("colorInput").value.trim();
      let matchedColor = null;

      // 入力がどの色に該当するか判定
      for (const key in colorMap) {
        if (colorMap[key].includes(input)) {
          matchedColor = key;
          break;
        }
      }

      if (matchedColor) {
        // 正解色だった場合
        if (!foundColors.includes(matchedColor)) {
          foundColors.push(matchedColor);
          updateDisplay();
        }
        document.getElementById("err").textContent = "";
      } else {
        // 不正解の場合
        alert("その色は切るべきコードではありません");
        document.getElementById("err").textContent = "間違っています";
      }

      // 入力欄を空にして次を入れやすくする
      document.getElementById("colorInput").value = "";

      // 全色揃ったら戻るボタン表示
      if (foundColors.length === 4) {
        document.getElementById("msg").textContent = "爆弾解除？";
        document.getElementById("err").textContent = "";
        document.getElementById("backButton").style.display = "inline-block";
      }
    }

    // 色を画面に浮かび上がらせる
    function updateDisplay() {
      const list = document.getElementById("colorList");
      list.textContent = foundColors.join("・");
    }

    // 戻るボタン（関数が無かったので追加。前のページに戻ります）
    function goBack() {
      history.back();
    }

    function reloadPage() {
      window.location.href = "colors.html";
    }

    function goToFinal() {
      window.location.href = "final.html";
    }
  </script>

</body>
</html>
