<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで正しい幅・倍率で表示するための指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最終問題</title>
  <style>
    @font-face {
      font-family: "Let's go Digital";
      src: url("Let's go Digital Regular.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Gothic", "Hiragino Sans", sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px;
      font-size: 24px;
      line-height: 1.6;
    }

    /* タイマー（元：36px） */
    .timer {
      font-family: "Let's go Digital", sans-serif;
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* 問題文（元：22px） */
    .question {
      font-size: 26px;
      margin: 0 auto 16px;
      max-width: 600px;
    }

    /* 入力欄（元：18px） */
    .input-box {
      width: 100%;
      max-width: 320px;
      font-size: 24px;
      padding: 12px;
      text-align: center;
    }

    /* ボタン（元：18px） */
    button {
      font-size: 24px;
      padding: 12px 32px;
      min-height: 52px;
      margin-top: 14px;
      color: black;
      background-color: white;
      border: 2px solid black;
      border-radius: 6px;
    }

    /* クリア時のメッセージ（元：22px） */
    .message-black {
      font-size: 26px;
      margin: 16px auto 0;
      max-width: 600px;
      color: black;
    }

    .message-yellow {
      font-size: 26px;
      margin: 16px auto 0;
      max-width: 600px;
      color: #FFFF00;
    }

    /* 「間違ってるよ」 */
    .error {
      color: red;
      font-size: 24px;
      margin-top: 10px;
      min-height: 1.6em;
    }
  </style>
</head>
<body>

  <div id="timer" class="timer"></div>

  <div class="question">最終問題！これまでの軌跡を振り返って隠された数字を見つけてね。</div>
  <!-- inputmode="numeric"：スマホで数字キーボードが出る -->
  <input id="finalInput" class="input-box" placeholder="数字を入力" inputmode="numeric">
  <br>
  <button onclick="checkFinal()">決定</button>

  <div id="msg" class="message"></div>
  <div id="err" class="error"></div>

  <script>
  let timerInterval;

  function initTimer() {
    if (!localStorage.getItem("endTime")) {
      const end = Date.now() + 20 * 60 * 1000;
      localStorage.setItem("endTime", end);
    }
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  function updateTimer() {
    const endTime = Number(localStorage.getItem("endTime"));
    const now = Date.now();
    const remaining = Math.floor((endTime - now) / 1000);

    if (remaining <= 0) {
      window.location.href = "gameover1.html";
      return;
    }

    const m = String(Math.floor(remaining / 60)).padStart(2, "0");
    const s = String(remaining % 60).padStart(2, "0");
    document.getElementById("timer").textContent = `${m}:${s}`;
  }

  initTimer();

  function checkFinal() {
    const v = document.getElementById("finalInput").value.trim();
    if (v === "2070") {

      // ★ ここでタイマーを止める
      clearInterval(timerInterval);

      localStorage.setItem("bombCleared", "true");

      document.getElementById("msg").innerHTML = `
        <div class="message-black">爆弾解除　おめでとう</div>
        <div class="message-black">だよねだよね！信じてたよ！</div>
        <div class="message-black">…いやまあ解けて当然なんだけどさ、でもよかったー。</div>
        <div class="message-black">驚かせるようなことしてごめんね？</div>
        <div class="message-black">また改めて□は送るね～</div>
        <div class="message-yellow">次はもっと難しくするね！</div>
      `;

      document.getElementById("err").textContent = "";
    } else {
      document.getElementById("msg").textContent = "";
      document.getElementById("err").textContent = "間違ってるよ";
    }
  }
  </script>

</body>
</html>
