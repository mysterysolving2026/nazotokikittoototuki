<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最終問題</title>
  <style>
    @font-face {
      font-family: "Let's go Digital";
      src: url("Let's go Digital Regular.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px;
      font-size: 24px;
      line-height: 1.6;
    }

    .timer {
      font-family: "Let's go Digital", sans-serif;
      font-size: 64px;
      margin-bottom: 20px;
    }

    .question {
      font-size: 26px;
      margin: 0 auto 16px;
      max-width: 600px;
    }

    .input-box {
      width: 100%;
      max-width: 320px;
      font-size: 24px;
      padding: 12px;
      text-align: center;
    }

    button {
      font-size: 24px;
      padding: 12px 32px;
      min-height: 52px;
      margin-top: 14px;
      color: black;
      background-color: white;
      border: 2px solid black;
      border-radius: 6px;
    }

    .message-black {
      font-size: 26px;
      margin: 16px auto 0;
      max-width: 600px;
      color: black;
    }

    .message-yellow {
      font-size: 26px;
      margin: 16px auto 0;
      max-width: 600px;
      color: #FFFF00;
    }

    .error {
      color: red;
      font-size: 24px;
      margin-top: 10px;
      min-height: 1.6em;
    }
  </style>
</head>
<body>

  <div id="timer" class="timer"></div>

  <div class="question">➅A'×B'×C'=？。</div>
  <input id="finalInput" class="input-box" placeholder="数字を入力" inputmode="numeric">
  <br>
  <button onclick="checkFinal()">決定</button>

  <div id="msg" class="message"></div>
  <div id="err" class="error"></div>

  <script>
  localStorage.setItem("currentPage", "final.html");
    
  const TIME_LIMIT = 60 * 60 * 1000; // 制限時間30分
  let timerInterval;

  function initTimer() {
    // 解除済みならタイマーを動かさない
    if (localStorage.getItem("bombCleared") === "true") return;

    if (!localStorage.getItem("endTime")) {
      localStorage.setItem("endTime", Date.now() + TIME_LIMIT);
    }
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  function updateTimer() {
    const endTime = Number(localStorage.getItem("endTime"));
    const remaining = Math.floor((endTime - Date.now()) / 1000);

    if (remaining <= 0) {
      window.location.href = "gameover.html";
      return;
    }

    const m = String(Math.floor(remaining / 60)).padStart(2, "0");
    const s = String(remaining % 60).padStart(2, "0");
    document.getElementById("timer").textContent = `${m}:${s}`;
  }

  initTimer();

  function checkFinal() {
    const v = document.getElementById("finalInput").value.trim();
    if (v === "2070") {
      clearInterval(timerInterval);
      localStorage.setItem("bombCleared", "true");

      document.getElementById("msg").innerHTML = `
        <div class="message-black">爆弾解除　おめでとう</div>
        <div class="message-black">だよねだよね！信じてたよ！</div>
        <div class="message-black">…いやまあ解けて当然なんだけどさ、でもよかったー。</div>
        <div class="message-black">驚かせるようなことしてごめんね？</div>
        <div class="message-black">また改めて□は送るね～</div>
        <div class="message-black">次はもっと難しくするね！</div>
      `;
      document.getElementById("err").textContent = "";
    } else {
      document.getElementById("msg").textContent = "";
      document.getElementById("err").textContent = "間違ってるよ";
    }
  }
  </script>

</body>
</html>
