<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>最終問題</title>
  <style>
    font-face {
      font-family: "Let's go Digital";
      src: url("Let's go Digital Regular.ttf") format("truetype");
    }
    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      margin-top: 60px;
    }
    .timer {
      font-family: "Let's go Digital", sans-serif;
      font-size: 36px;
      margin-bottom: 20px;
    }
    .question {
      font-size: 22px;
      margin-bottom: 10px;
    }
    .input-box {
      width: 200px;
      font-size: 18px;
      padding: 4px;
      text-align: center;
    }
    button {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      font-size: 18px;
      padding: 6px 12px;
      margin-top: 8px;
      background-color: #4B0082;
      color: white;
      border: 2px solid black;
    }
    .message {
      font-size: 22px;
      margin-top: 15px;
      color: green;
    }
    .error {
      color: red;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div id="timer" class="timer"></div>

  <div class="question">これまでの軌跡を振り返って隠された数字を見つけよ。</div>
  <input id="finalInput" class="input-box" placeholder="数字を入力">
  <br>
  <button onclick="checkFinal()">決定</button>

  <div id="msg" class="message"></div>
  <div id="err" class="error"></div>

  <div id="pdfLink" style="margin-top:20px;"></div>

  <script>
    function initTimer() {
      if (localStorage.getItem("bombCleared") === "true") {
        document.getElementById("timer").textContent = "";
        return;
      }

      if (!localStorage.getItem("endTime")) {
        const end = Date.now() + 10 * 60 * 1000;
        localStorage.setItem("endTime", end);
      }
      updateTimer();
      setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      if (localStorage.getItem("bombCleared") === "true") return;

      const endTime = Number(localStorage.getItem("endTime"));
      const now = Date.now();
      const remaining = Math.floor((endTime - now) / 1000);

      if (remaining <= 0) {
        window.location.href = "gameover.html";
        return;
      }
      const m = String(Math.floor(remaining / 60)).padStart(2, "0");
      const s = String(remaining % 60).padStart(2, "0");
      document.getElementById("timer").textContent = m + ":" + s;
    }

    initTimer();

    function checkFinal() {
      const v = document.getElementById("finalInput").value.trim();
      if (v === "2070") {
        localStorage.setItem("bombCleared", "true");
        document.getElementById("msg").textContent = "爆弾解除　おめでとう";
        document.getElementById("err").textContent = "";
        document.getElementById("pdfLink").innerHTML =
          '<a href="karuta.pdf" target="_blank">解説はこちら</a>';
      } else {
        document.getElementById("msg").textContent = "";
        document.getElementById("err").textContent = "間違っています";
      }
    }
  </script>

</body>
</html>
