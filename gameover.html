<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲームオーバー</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px;
      font-size: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0 20px;
    }

    .message {
      font-size: 32px;
      margin-top: 24px;
      color: red;
    }

    video {
      margin-top: 20px;
      width: 100%;
      max-width: 480px;
      height: auto;
    }

    .link-button {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      min-height: 52px;
      font-size: 24px;
      color: white;
      background-color: black;
      border-radius: 6px;
      text-decoration: none;
    }

    /* 「続ける」ボタン */
    .continue-button {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      margin-top: 24px;
      padding: 12px 40px;
      min-height: 52px;
      font-size: 24px;
      color: black;
      background-color: white;
      border: 2px solid black;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>あーあ、信じてたのに...</h1>

  <video src="bikkuribako.mp4" autoplay playsinline controls></video>

  <div class="message">残念だったね</div>

  <div>
    <a href="karuta.pdf" target="_blank" class="link-button">解説はこっち</a>
  </div>

  <!-- 最後の行：続けるボタン -->
  <div>
    <button class="continue-button" onclick="continueGame()">続ける</button>
  </div>

  <script>
    // 続けたときにもらえる時間（分）。好きな数字に変えてOK
    const CONTINUE_MINUTES = 10;

    // ゲームオーバーになったらタイマー情報は消しておく
    localStorage.removeItem("endTime");
    localStorage.removeItem("bombCleared");

    function continueGame() {
      // 新しい制限時間をセット
      localStorage.setItem("endTime", Date.now() + CONTINUE_MINUTES * 60 * 1000);

      // 最後にいたページへ戻る（記録が無ければ最初のページへ）
      const page = localStorage.getItem("currentPage") || "index.html";
      window.location.href = page;
    }
  </script>

</body>
</html>
