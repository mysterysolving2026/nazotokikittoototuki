<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ゲームオーバー</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      text-align: center;
      margin: 0;
      padding: 40px 16px;
      font-size: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0 20px;
    }

    .message {
      font-size: 32px;
      margin-top: 24px;
      color: red;
    }

    video {
      margin-top: 20px;
      width: 100%;
      max-width: 480px;
      height: auto;
    }

    .link-button {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      min-height: 52px;
      font-size: 24px;
      color: white;
      background-color: black;
      border-radius: 6px;
      text-decoration: none;
    }

    .continue-button {
      font-family: "MS Mincho", "Hiragino Mincho ProN", serif;
      margin-top: 24px;
      padding: 12px 40px;
      min-height: 52px;
      font-size: 24px;
      color: black;
      background-color: white;
      border: 2px solid black;
      border-radius: 6px;
    }

  </style>

</head>

<body>

  <h1>
    あーあ、信じてたのに...
  </h1>


  bikkuribako.mp4</video>


  <div class="message">
    残念だったね
  </div>


  <div>

    <a
      href="karuta.pdf"
      target="_blank"
      class="link-button"
    >
      解説はこっち
    </a>

  </div>


  <div>

    <button
      class="continue-button"
      onclick="continueGame()"
    >
      続ける
    </button>

  </div>


  <script>

    /*
    =========================
    続ける時間
    =========================
    */

    const CONTINUE_MINUTES = 10;


    /*
    =========================
    ゲームオーバー画面では
    endTimeを削除しない
    =========================

    ここが以前との大きな変更点です。

    「続ける」を押したときだけ
    新しいendTimeを設定します。
    */


    localStorage.removeItem(
      "bombCleared"
    );


    /*
    =========================
    続ける
    =========================
    */

    function continueGame() {

      /*
      現在時刻から10分後を
      新しい終了時刻にする
      */

      const newEndTime =
        Date.now()
        +
        CONTINUE_MINUTES
        * 60
        * 1000;


      localStorage.setItem(
        "endTime",
        String(newEndTime)
      );


      /*
      最後にいた場所
      */

      let page =
        localStorage.getItem(
          "currentPage"
        );
